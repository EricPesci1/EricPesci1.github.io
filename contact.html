    <header class="site-header">

    <main class="container">
      <section class="card">
        <h2>Send me an email!</h2>

        <!-- Contact form for sending me an email. I still need to connect this to an email service to make it functional, but I thought it would be fun to include. -->
        <form
          id="contactForm"
          class="contact-form"
          onsubmit="handleContact(event)"
        >
          <label for="cf-name">Your name</label>
          <input
            id="cf-name"
            name="name"
            type="text"
            required
            placeholder="Full name"
          />

          <label for="cf-subject">Subject</label>
          <input
            id="cf-subject"
            name="subject"
            type="text"
            required
            placeholder="Subject"
          />

          <label for="cf-message">Message</label>
          <textarea
            id="cf-message"
            name="message"
            rows="8"
            required
            placeholder="Write me a message here..."
          ></textarea>
          <!-- Button for submitting the contact form, in the future I will integrate my email so I can receive them. The javascript for this button's functionality is in the contact.js file -->
          <div class="contact-form-actions">
            <button type="submit" class="submit-btn">Send Message</button>
            <div id="cf-status" class="contact-form-status"></div>
          </div>
        </form>
      </section>
    </main>
